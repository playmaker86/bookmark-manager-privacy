<?xml version="1.0" encoding="UTF-8"?>
<!-- Activity Reservation Icon — Calendar + Check -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Activity Calendar with Check</title>
  <desc>Flat calendar icon with checkmark for activity reservation</desc>
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#4FC3F7"/>
      <stop offset="1" stop-color="#2196F3"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="64" y="64" width="896" height="896" rx="160" fill="#E3F2FD"/>

  <!-- Calendar body -->
  <rect x="170" y="240" width="684" height="560" rx="48" fill="#FFFFFF"/>
  <!-- Header -->
  <rect x="170" y="240" width="684" height="140" rx="32" fill="#E1F5FE"/>

  <!-- Rings / binding -->
  <rect x="284" y="128" width="56" height="120" rx="12" fill="#FFFFFF" opacity="0.15" transform="rotate(0 312 188)"/>
  <rect x="684" y="128" width="56" height="120" rx="12" fill="#FFFFFF" opacity="0.15" transform="rotate(0 712 188)"/>

  <!-- Date grid simplified (dots) -->
  <g fill="#B3E5FC" opacity="0.9">
    <circle cx="320" cy="380" r="14"/>
    <circle cx="464" cy="380" r="14"/>
    <circle cx="608" cy="380" r="14"/>
    <circle cx="752" cy="380" r="14"/>

    <circle cx="320" cy="484" r="14"/>
    <circle cx="464" cy="484" r="14"/>
    <circle cx="608" cy="484" r="14"/>
    <circle cx="752" cy="484" r="14"/>

    <circle cx="320" cy="588" r="14"/>
    <circle cx="464" cy="588" r="14"/>
    <circle cx="608" cy="588" r="14"/>
    <circle cx="752" cy="588" r="14"/>
  </g>

  <!-- Checkmark badge -->
  <g transform="translate(0,0)">
    <circle cx="720" cy="700" r="136" fill="#4FC3F7" stroke="#2196F3" stroke-width="6"/>
    <path d="M660 700 l40 40 l120 -140" fill="none" stroke="#fff" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
