<?xml version="1.0" encoding="UTF-8"?>
<!-- Activity Reservation Icon — Ticket + Clock -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Activity Ticket with Clock</title>
  <desc>Ticket shape with a clock overlay representing booking/time</desc>
  <defs>
    <linearGradient id="g2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#4FC3F7"/>
      <stop offset="1" stop-color="#2196F3"/>
    </linearGradient>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="160" fill="#E3F2FD"/>

  <!-- Ticket -->
  <path d="M200 320 h624 a40 40 0 0 1 40 40 v144 a56 56 0 0 0 0 112 v144 a40 40 0 0 1 -40 40 h-624 a40 40 0 0 1 -40 -40 v-528 a40 40 0 0 1 40 -40 z" fill="url(#g2)"/>

  <!-- Ticket perforation line -->
  <line x1="520" y1="360" x2="520" y2="664" stroke="#B3E5FC" stroke-dasharray="12,18" stroke-width="6" opacity="0.85"/>

  <!-- Clock circle -->
  <circle cx="380" cy="500" r="132" fill="#FFFFFF" stroke="#4FC3F7" stroke-width="12"/>
  <!-- Clock hands -->
  <line x1="380" y1="500" x2="380" y2="420" stroke="#4FC3F7" stroke-width="20" stroke-linecap="round"/>
  <line x1="380" y1="500" x2="450" y2="540" stroke="#4FC3F7" stroke-width="18" stroke-linecap="round"/>

  <!-- Small decorative stars on ticket -->
  <g fill="#E1F5FE" opacity="0.9">
    <circle cx="680" cy="420" r="18"/>
    <circle cx="740" cy="520" r="12"/>
    <circle cx="640" cy="600" r="14"/>
  </g>
</svg>
